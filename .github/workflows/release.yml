name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build and validate Splunk package
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/build_release.sh "${TAG#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          test -f "release-notes/${VERSION}.md"
          gh release create "$TAG" \
            "dist/rest_profiler-${VERSION}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            "dist/appinspect-${VERSION}.json" \
            --verify-tag \
            --title "REST Profiler for Splunk ${VERSION}" \
            --notes-file "release-notes/${VERSION}.md"
