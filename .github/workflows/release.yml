name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version to validate"
        required: true
        default: "1.0.1"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make package VERSION="$VERSION"

      - name: Run AppInspect
        id: appinspect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set +e
          make appinspect-only VERSION="$VERSION"
          make_code=$?
          set -e

          status_file="dist/appinspect-${VERSION}.exit-code"
          if [[ -f "$status_file" ]]; then
            code="$(tr -d '[:space:]' < "$status_file")"
          else
            code="$make_code"
          fi

          if [[ ! "$code" =~ ^[0-9]+$ ]] || (( code < 0 || code > 255 )); then
            echo "Invalid AppInspect exit code: $code" >&2
            exit 1
          fi

          echo "make_exit_code=$make_code"
          echo "appinspect_exit_code=$code"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Preserve package and AppInspect report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rest-profiler-${{ steps.version.outputs.version }}-validation
          path: |
            dist/rest_profiler-*.tar.gz
            dist/SHA256SUMS.txt
            dist/appinspect-*.json
            dist/appinspect-*.exit-code
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce AppInspect gate
        env:
          APPINSPECT_EXIT_CODE: ${{ steps.appinspect.outputs.exit_code }}
        run: |
          if [[ "$APPINSPECT_EXIT_CODE" != "0" ]]; then
            echo "AppInspect failed with exit code $APPINSPECT_EXIT_CODE." >&2
            echo "The package and JSON report were preserved as workflow artifacts." >&2
            exit "$APPINSPECT_EXIT_CODE"
          fi

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "release-notes/${VERSION}.md"
          gh release create "$TAG" \
            "dist/rest_profiler-${VERSION}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            "dist/appinspect-${VERSION}.json" \
            --verify-tag \
            --title "REST Profiler for Splunk ${VERSION}" \
            --notes-file "release-notes/${VERSION}.md"
